<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d14">
  <title>Scanner QR Presensi</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { --bg:#0d0d14; --surface:#15151f; --surface2:#1c1c2a; --lime:#c8f731; --white:#fff; --muted:rgba(255,255,255,.55); --danger:#ff8a8a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:var(--bg); color:var(--white); font-family:Arial,sans-serif; }
    main { width:min(100%,420px); }
    .badge { color:var(--lime); font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    h1 { margin:8px 0 4px; font-size:1.55rem; }
    p { margin:0 0 18px; color:var(--muted); font-size:.86rem; line-height:1.5; }
    .card { overflow:hidden; border:1px solid rgba(255,255,255,.1); border-radius:24px; background:var(--surface); }
    #reader { width:100%; background:#000; min-height:280px; }
    #reader video { width:100%!important; height:auto!important; display:block; }
    #reader__dashboard { display:none!important; }
    .status { padding:16px 18px; color:var(--muted); font-size:.84rem; }
    .status.error { color:var(--danger); }
    button { width:100%; margin-top:14px; padding:15px; border:0; border-radius:16px; cursor:pointer; background:var(--lime); color:#0d0d14; font-weight:800; font-size:.9rem; }
    button:disabled { opacity:.45; cursor:wait; }
  </style>
</head>
<body>
  <main>
    <div class="badge">Scanner Admin</div>
    <h1>Pindai QR Peserta</h1>
    <p>Izinkan akses kamera, lalu arahkan kamera ke QR Code peserta.</p>
    <div class="card">
      <div id="reader"></div>
      <div class="status" id="status">Menyiapkan kamera…</div>
    </div>
    <button id="retryButton" type="button" onclick="startScanner()" style="display:none">Coba Lagi</button>
  </main>

  <script>
    let scanner;
    let scanning = false;
    let delivered = false;
    const statusEl = document.getElementById('status');
    const retryButton = document.getElementById('retryButton');
    const params = new URLSearchParams(window.location.search);
    const returnOrigin = params.get('returnOrigin');
    const backendUrl = 'https://script.google.com/macros/s/AKfycbxyqt4qTJ7-wNBPU5dK9PaQRlu6txl4l7NaaHbFkKRyntQrnByJCnW09PuY8UNeaEO7rA/exec';

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.className = 'status' + (isError ? ' error' : '');
    }

    function startScanner() {
      if (scanning || delivered) return;
      retryButton.style.display = 'none';
      setStatus('Meminta akses kamera…');
      scanner = new Html5Qrcode('reader');

      Html5Qrcode.getCameras().then(function(cameras) {
        if (!cameras.length) throw new Error('Tidak ada kamera yang terdeteksi.');
        const backCamera = cameras.find(function(camera) {
          return /back|rear|environment|belakang/i.test(camera.label || '');
        });
        return scanner.start(backCamera ? backCamera.id : cameras[0].id,
          { fps: 10, qrbox: { width: 220, height: 220 } },
          onScanSuccess,
          function() {});
      }).then(function() {
        scanning = true;
        setStatus('Kamera aktif — arahkan ke QR Code peserta.');
      }).catch(function(error) {
        setStatus('Kamera tidak dapat digunakan: ' + error, true);
        retryButton.style.display = 'block';
      });
    }

    function onScanSuccess(decodedText) {
      if (delivered) return;
      delivered = true;
      setStatus('QR terbaca. Mengirim ke halaman Admin…');
      scanning = false;
      if (scanner) scanner.stop().catch(function() {});

      if (window.opener && returnOrigin) {
        window.opener.postMessage({ type: 'QR_SCAN_RESULT', payload: decodedText }, returnOrigin);
        setTimeout(function() { window.close(); }, 600);
        return;
      }

      // Scanner dapat digunakan langsung tanpa membuka halaman Admin.
      // Apps Script memvalidasi payload sebelum mencatatnya ke Spreadsheet.
      setStatus('QR terbaca. Menyimpan presensi…');
      fetch(backendUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'recordPresensi', payload: decodedText })
      }).then(function() {
        setStatus('Data dikirim ke server. Siap scan peserta berikutnya.');
        setTimeout(function() {
          delivered = false;
          startScanner();
        }, 1200);
      }).catch(function() {
        setStatus('Data gagal dikirim. Periksa koneksi internet lalu coba lagi.', true);
        delivered = false;
        retryButton.style.display = 'block';
      });
    }

    startScanner();
  </script>
</body>
</html>
