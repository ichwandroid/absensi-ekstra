<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scanner QR Presensi</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>:root{--b:#0d0d14;--s:#15151f;--l:#c8f731;--m:#aaa;--x:#ff8a8a}*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--b);color:#fff;font:14px Arial}main{max-width:1080px;margin:auto}h1{margin:8px 0}.dash{display:grid;grid-template-columns:1.25fr .75fr;gap:20px}.card{overflow:hidden;background:var(--s);border:1px solid #ffffff18;border-radius:24px}#reader{min-height:320px;background:#000}#reader video{width:100%!important}.status,.head{padding:16px;color:var(--m)}.head{display:flex;justify-content:space-between;color:#fff;border-bottom:1px solid #ffffff18}.list{margin:0;padding:5px 18px;list-style:none;max-height:440px;overflow:auto}.item{display:flex;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #ffffff18}.ok{padding:8px;border-radius:9px;background:#c8f73120;color:var(--l);font-weight:bold}.info{flex:1;min-width:0}.name{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub,.time{font-size:12px;color:var(--m)}button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:16px;background:var(--l);font-weight:bold}.toast{position:fixed;right:24px;bottom:24px;padding:14px;border-radius:14px;background:var(--l);color:#111;font-weight:bold;opacity:0;transition:.25s}.toast.on{opacity:1}.toast.err{background:var(--x)}@media(max-width:700px){body{padding:18px}.dash{grid-template-columns:1fr}.list{max-height:260px}}</style><body><div id="toast" class="toast"></div><main><small style="color:#c8f731">SCANNER ADMIN</small><h1>Pindai QR Peserta</h1><p style="color:#aaa">Mode tablet - kamera dan riwayat scan ditampilkan bersamaan.</p><div class="dash"><section><div class="card"><div id="reader"></div><div id="status" class="status">Menyiapkan kamera...</div></div><button id="retry" onclick="start()" hidden>Coba Lagi</button></section><aside class="card"><div class="head"><b>Scan Terkini</b><b id="count">0</b></div><ul id="list" class="list"></ul></aside></div></main><script>
let q,on=0,busy=0,timer;const U='https://script.google.com/macros/s/AKfycbxyqt4qTJ7-wNBPU5dK9PaQRlu6txl4l7NaaHbFkKRyntQrnByJCnW09PuY8UNeaEO7rA/exec',K='absensi-ekstra-scan-history',H=JSON.parse(localStorage.getItem(K)||'[]'),S=document.querySelector('#status'),L=document.querySelector('#list'),C=document.querySelector('#count'),T=document.querySelector('#toast');function msg(s,e){clearTimeout(timer);T.textContent=s;T.className='toast on'+(e?' err':'');timer=setTimeout(()=>T.className='toast',3200)}function data(s){try{return JSON.parse(s)}catch(e){return{}}}function draw(){C.textContent=H.length;L.innerHTML=H.length?H.map(x=>'<li class="item"><b class="ok">OK</b><div class="info"><div class="name">'+x.n+'</div><div class="sub">'+x.r+' - Berhasil dikirim</div></div><span class="time">'+x.t+'</span></li>').join(''):'<li style="padding:30px;color:#aaa;text-align:center">Belum ada data pada perangkat ini.</li>'}function start(){if(on||busy)return;retry.hidden=1;S.textContent='Meminta akses kamera...';q=new Html5Qrcode('reader');Html5Qrcode.getCameras().then(c=>{if(!c.length)throw Error('Kamera tidak ditemukan');let r=c.find(x=>/back|rear|environment|belakang/i.test(x.label||''));return q.start((r||c[0]).id,{fps:10,qrbox:{width:220,height:220}},scan,()=>{})}).then(()=>{on=1;S.textContent='Kamera aktif - arahkan ke QR Code peserta.'}).catch(e=>{S.textContent='Kamera tidak dapat digunakan: '+e;retry.hidden=0})}function scan(s){if(busy)return;let d=data(s),id=String(d.id||s);if(H.some(x=>x.id===id)){msg((d.nama||'Peserta ini')+' sudah dipindai.',1);return}busy=1;on=0;q.stop().catch(()=>{});S.textContent='Menyimpan presensi...';fetch(U,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'recordPresensi',payload:s})}).then(()=>{H.unshift({id:id,n:d.nama||'QR terbaca',r:d.jabatan||'Peserta',t:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})});H.splice(50);localStorage.setItem(K,JSON.stringify(H));draw();msg((d.nama||'Peserta')+' berhasil dikirim ke presensi.');S.textContent='Data berhasil dikirim. Siap scan berikutnya.';setTimeout(()=>{busy=0;start()},1000)}).catch(()=>{busy=0;S.textContent='Gagal mengirim data.';msg('Data gagal dikirim.',1);retry.hidden=0})}draw();start();</script>
