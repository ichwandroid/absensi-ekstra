<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Anak Saleh</title>
  
  <!-- Link Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  
  <!-- Apple iOS PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Anak Saleh">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background-color: #0d0d14;
    }
    iframe {
      width: 100%;
      height: 100%;
      height: 100svh;
      height: 100dvh;
      min-height: -webkit-fill-available;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Embed Link Google Apps Script Anda -->
  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbxyqt4qTJ7-wNBPU5dK9PaQRlu6txl4l7NaaHbFkKRyntQrnByJCnW09PuY8UNeaEO7rA/exec" allow="geolocation; microphone; camera"></iframe>

  <script>
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
      document.getElementById('appFrame').style.height = window.innerHeight + 'px';
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', function() { setTimeout(setAppHeight, 200); });

    // Mendaftarkan Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker Registered!', reg))
          .catch(err => console.error('Service Worker Registration Failed!', err));
      });
    }
  </script>
</body>
</html>
